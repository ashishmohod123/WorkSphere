{% extends 'base.html' %}

{% block title %}Add Leave Category{% endblock %}
{% block page_title %}Create Leave Category{% endblock %}

{% block content %}
<div class="card card-custom p-4 max-w-lg mx-auto">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold small">Category Name</label>
            {{ form.name }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Category Code</label>
            {{ form.code }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Days Allowed Per Year</label>
            {{ form.days_allowed }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Policy Description</label>
            {{ form.description }}
        </div>
        <div class="mb-4 form-check">
            {{ form.is_active }}
            <label class="form-check-label fw-semibold small">Active</label>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'leave_management:leave_type_list' %}" class="btn btn-light border rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Save Category</button>
        </div>
    </form>
</div>
{% endblock %}
