{% extends 'base.html' %}

{% block title %}Apply for Leave{% endblock %}
{% block page_title %}Submit Time-Off Application{% endblock %}

{% block content %}
<div class="card card-custom p-4 max-w-lg mx-auto">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold small">Leave Category</label>
            {{ form.leave_type }}
        </div>
        <div class="row g-3 mb-3">
            <div class="col-6">
                <label class="form-label fw-semibold small">Start Date</label>
                {{ form.start_date }}
            </div>
            <div class="col-6">
                <label class="form-label fw-semibold small">End Date</label>
                {{ form.end_date }}
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Reason / Remarks</label>
            {{ form.reason }}
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'leave_management:my_leaves' %}" class="btn btn-light border rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="fa-solid fa-paper-plane me-1"></i> Submit Request
            </button>
        </div>
    </form>
</div>
{% endblock %}
