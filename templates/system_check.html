<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - System Health Check</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .badge-status {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
        }
        .icon-box {
            width: 72px;
            height: 72px;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-4 p-md-5 text-center">
                    <div class="icon-box">
                        <i class="fa-solid fa-people-roof"></i>
                    </div>
                    <h2 class="fw-bold text-white mb-2">{{ project_name }}</h2>
                    <p class="text-secondary mb-4">Enterprise Human Resource Management System</p>
                    
                    <div class="d-inline-flex align-items-center justify-content-center gap-2 mb-4">
                        <span class="badge-status">
                            <i class="fa-solid fa-circle-check me-1"></i> {{ status }}
                        </span>
                        <span class="badge bg-dark border border-secondary text-light">
                            {{ version }}
                        </span>
                    </div>

                    <div class="bg-dark bg-opacity-50 rounded-3 p-3 text-start mb-4 border border-secondary border-opacity-25">
                        <div class="d-flex align-items-center gap-2 text-info fw-semibold mb-2">
                            <i class="fa-solid fa-layer-group"></i>
                            <span>{{ step }}</span>
                        </div>
                        <ul class="list-unstyled text-secondary small mb-0 ps-1">
                            <li class="mb-1"><i class="fa-solid fa-check text-success me-2"></i>Virtual Environment Active</li>
                            <li class="mb-1"><i class="fa-solid fa-check text-success me-2"></i>Django Core Configured</li>
                            <li class="mb-1"><i class="fa-solid fa-check text-success me-2"></i>Template & Static Engine Linked</li>
                            <li><i class="fa-solid fa-check text-success me-2"></i>Ready for Phase 2: Custom Authentication</li>
                        </ul>
                    </div>

                    <p class="text-muted small mb-0">
                        WorkSphere Mentor Engine &bull; Senior Django Architect
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
