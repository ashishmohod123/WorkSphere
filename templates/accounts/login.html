<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WorkSphere HRMS (India)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }
        .login-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            color: #ffffff;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5);
        }
        .btn-demo {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            color: #334155;
            transition: all 0.2s;
        }
        .btn-demo:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">
                <i class="fa-solid fa-layer-group text-white"></i>
            </div>
            <h3 class="fw-bold mb-1">WorkSphere</h3>
            <p class="text-secondary small mb-0">Enterprise HRMS &bull; India Operations</p>
        </div>

        <div class="p-4 p-md-5">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show small py-2 rounded-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Username / Employee ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                        {{ form.username }}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        {{ form.password }}
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow-sm py-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to WorkSphere
                </button>
            </form>

                <!-- Quick 1-Click Demo Logins -->
                <div class="small fw-semibold text-muted mb-2">⚡ 1-Click Demo Accounts (Indian Staff):</div>
                <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                    <button type="button" class="btn-demo" onclick="fillCredentials('admin', 'admin123')">
                        <i class="fa-solid fa-shield-halved text-danger me-1"></i> Ashish Mohod (Admin)
                    </button>
                    <button type="button" class="btn-demo" onclick="fillCredentials('hr_pooja', 'hr12345')">
                        <i class="fa-solid fa-user-tie text-primary me-1"></i> Pooja (HR)
                    </button>
                    <button type="button" class="btn-demo" onclick="fillCredentials('rohit_v', 'emp12345')">
                        <i class="fa-solid fa-code text-info me-1"></i> Rohit (Lead Dev)
                    </button>
                </div>

                <div class="pt-2 border-top">
                    <a href="{% url 'dashboard:portfolio' %}" class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 fw-semibold">
                        <i class="fa-solid fa-folder-open me-1"></i> View Ashish's Projects & Developer Portfolio
                    </a>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillCredentials(user, pass) {
            document.getElementById('id_username').value = user;
            document.getElementById('id_password').value = pass;
        }
    </script>
</body>
</html>
