{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Delete {{ type }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 max-w-md mx-auto text-center">
    <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
    <h5 class="fw-bold mb-2">Delete {{ type }}?</h5>
    <p class="text-muted small mb-4">Are you sure you want to permanently delete <strong>{{ object }}</strong>? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-light border rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold">Yes, Delete</button>
        </div>
    </form>
</div>
{% endblock %}
