{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 max-w-lg mx-auto">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold small">Job Title</label>
            {{ form.title }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Department</label>
            {{ form.department }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Description</label>
            {{ form.description }}
        </div>
        <div class="mb-4 form-check">
            {{ form.is_active }}
            <label class="form-check-label fw-semibold small">Is Active</label>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'employees:designation_list' %}" class="btn btn-light border rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Save Designation</button>
        </div>
    </form>
</div>
{% endblock %}
